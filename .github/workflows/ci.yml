name: ci

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - run: make verify-go

  record-platform-pg16-catalog:
    name: record-platform-pg16-catalog (${{ matrix.postgres_image }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        postgres_image:
          - "postgres:16.0"
          - "postgres:16.6"
          - "postgres:16.12"
    env:
      HOUFENG_RECORD_PLATFORM_POSTGRES_IMAGE: ${{ matrix.postgres_image }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Run strict PG16 catalog evidence
        shell: bash
        run: |
          set -euo pipefail
          events=$(mktemp)
          trap 'rm -f "$events"' EXIT
          scripts/test-record-platform-integration.sh pg16-catalog -- \
            go test -json ./internal/center/store/migrate \
            -run '^(TestPostgresIntegrationAppACLR2|TestPostgresIntegrationAppACLCurrent)$' -count=1 | tee "$events"
          jq -se '
            def package_event:
              .Package == "houfeng/internal/center/store/migrate";
            [.[] | select(package_event)] as $package_events
            | ["TestPostgresIntegrationAppACLR2", "TestPostgresIntegrationAppACLCurrent"] as $anchors
            | (all($anchors[];
                . as $anchor
                | [$package_events[] | select(((.Test // "") | test("^" + $anchor + "($|/)")))] as $anchor_events
                | (($anchor_events | map(select(.Action == "run")) | length) > 0)
                  and (($anchor_events | map(select(.Action == "pass")) | length) > 0)
              ))
              and (($package_events | map(select(.Action == "skip")) | length) == 0)
              and (($package_events | map(select(.Action == "fail")) | length) == 0)
          ' "$events" >/dev/null

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Verify web recipe isolates caller environment
        run: NODE_ENV=production make verify-web

  web-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Cache Playwright Chromium
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('web/package-lock.json') }}
      - name: Install web dependencies
        run: env -u NODE_ENV npm --prefix web ci --include=dev
      # Reconciling apt state is best-effort on purpose. The hosted image already
      # carries the Chromium libraries, so a broken Ubuntu mirror here used to
      # hang until the job timeout and report nothing. Bound it instead and let
      # the contract gate below fail loudly if a library is genuinely missing.
      - name: Reconcile Chromium system dependencies
        continue-on-error: true
        timeout-minutes: 5
        run: timeout 240s npm --prefix web exec playwright install-deps -- chromium
      - name: Install lockfile-compatible Chromium
        timeout-minutes: 5
        run: npm --prefix web exec playwright install -- chromium
      - name: Run Chromium contract gate
        run: npm --prefix web run test:e2e
      - name: Upload browser failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-${{ github.run_id }}
          path: |
            web/playwright-report
            web/test-results/playwright
          if-no-files-found: warn
          retention-days: 7

  docker-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          build-args: |
            VERSION=dev
          cache-from: type=gha
          cache-to: type=gha,mode=max,ignore-error=true
